name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # No secrets and no environment here: all dev-dependency code (npm ci, tests, tsc) runs in this job only.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag name
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Tag name is not a release tag (vX.Y.Z[-suffix])" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged commit on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit is not on main; refusing to release" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$TAG" != "v$(node -p "require('./package.json').version")" ]; then
            echo "Tag $TAG does not match package.json version" >&2
            exit 1
          fi
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: turbopress-cli-tarball
          path: '*.tgz'
          if-no-files-found: error

  # Only downloads the tarball; never runs npm ci, tests or build, so no dev-dependency code sees the token.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: turbopress-cli-tarball
          path: tarball
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish tarball
        working-directory: tarball
        run: npm publish ./*.tgz --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
